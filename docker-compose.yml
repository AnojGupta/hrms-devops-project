services:

  postgres:
    image: postgres:17
    container_name: hrms-postgres

    environment:
      POSTGRES_DB: hrms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root

    volumes:
      - hrms-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - hrms-network


  backend:
    image: developeranuj/hrms-backend:latest
    container_name: hrms-backend

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/hrms_db
      DB_USERNAME: postgres
      DB_PASSWORD: root
      JWT_SECRET: hZ1CmzXnhXQiUdfgQUOK84s9j/YgiXHhKk8/OA4g7vE=


    ports:
      - "8082:8082"

    networks:
      - hrms-network


  frontend:
    image: developeranuj/hrms-frontend:latest
    container_name: hrms-frontend

    depends_on:
      - backend

    ports:
      - "5174:80"

    networks:
      - hrms-network


volumes:
  hrms-postgres-data:


networks:
  hrms-network:
